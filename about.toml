# Notices of the Rust dependencies for THIRD-PARTY-LICENSES.html (cargo-about, run by
# scripts/demo-package.sh). The accepted list mirrors deny.toml, which is the license gate.
accepted = [
    "AGPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-dev-dependencies = true

# SpacemanDMM's crates declare no license in their manifests (deny.toml, licenses.clarify); the
# repository's LICENSE is GPL-3.0.
[dreammaker.clarify]
license = "GPL-3.0-or-later"
git = [{ path = "LICENSE", checksum = "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986" }]

[builtins-proc-macro.clarify]
license = "GPL-3.0-or-later"
git = [{ path = "LICENSE", checksum = "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986" }]

[interval-tree.clarify]
license = "GPL-3.0-or-later"
