[package]
name = "ss13_net"
description = "Networking over WebTransport (wtransport). The only crate that imports the network library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ss13_shared.workspace = true
bevy = { workspace = true, features = ["std", "bevy_log"] }
# Channels only: they need no runtime, so the loopback transport works on wasm32.
tokio = { version = "1.54", features = ["sync"] }
serde.workspace = true
postcard.workspace = true
ss13_world = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport = { version = "0.7.2", features = ["quinn"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros"] }

# `bevy::platform::time::Instant` from `web-time`: `std::time::Instant::now` panics on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }

[dev-dependencies]
ss13_world.workspace = true

[features]
client = ["dep:ss13_world"]
server = ["dep:ss13_world"]

[[example]]
name = "headless_client"
required-features = ["client"]

[lints]
workspace = true

[[test]]
name = "replication_load"
required-features = ["client", "server"]
