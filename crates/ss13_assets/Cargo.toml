[package]
name = "ss13_assets"
description = "Import of BYOND assets: .dmi -> atlases + manifest, .dmm -> map data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ss13_data = { path = "../ss13_data" }
ss13_shared.workspace = true
serde.workspace = true
thiserror.workspace = true
png.workspace = true
postcard.workspace = true
# Atlas page files (`page`): decode ~3x faster than PNG.
qoi = "0.4.1"
rayon = "1.12"
# Reads the `icon` of each type from `ss13_dm_extract` output for map usage.
serde_json = "1.0.154"

[lints]
workspace = true
