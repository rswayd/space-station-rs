# Browser demo (docs/RUNNING.md, "Browser demo"): builds the static site (scripts/web-build.sh)
# and deploys it to Cloudflare Pages. Manual runs only (the repository is private: Actions minutes
# are limited). Needs the repository secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages:
# Edit") and CLOUDFLARE_ACCOUNT_ID, and a Pages project named space-station-rs.
name: web

on:
  workflow_dispatch:

env:
  # The BandaStation commit the assets are converted from (ASSETS-LICENSE.md).
  BANDASTATION_SHA: ce5b1f159748db35281bd3b673551598807f4a0b
  BINARYEN_VERSION: "130"
  CARGO_TERM_COLOR: always

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  data:
    name: assets and map files
    runs-on: ubuntu-latest
    env:
      SS13_SOURCE: ${{ github.workspace }}/BandaStation
      ASSETS: ${{ github.workspace }}/generated
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ss220club/BandaStation
          ref: ${{ env.BANDASTATION_SHA }}
          fetch-depth: 1
          path: BandaStation
      # .cargo/config.toml links linux builds with clang + mold.
      - run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: Swatinem/rust-cache@v2
      # The converter commands of docs/RUNNING.md, "Generate assets".
      - run: cargo run -p ss13_dm_extract -- --out $ASSETS/dm_types.json
      - run: cargo run -p ss13_assets --bin ss13-import -- dmi --out $ASSETS --types $ASSETS/dm_types.json
      - run: cargo run -p ss13_mapload --bin ss13-mapload -- convert --assets $ASSETS
      - run: scripts/demo-package.sh "$SS13_SOURCE" "$ASSETS" pkg
      - uses: actions/upload-artifact@v4
        with:
          name: web-data
          path: pkg
          if-no-files-found: error

  site:
    name: wasm build and site
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Host-side build scripts and proc macros still link with clang + mold.
      - run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        run: echo "WASM_BINDGEN=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - name: binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: web-data
          path: pkg
      - run: scripts/web-build.sh pkg dist
      # Cloudflare Pages rejects files over 25 MiB.
      - name: file size limit
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "over 25 MiB: $big"; exit 1; fi
      # Creates the Pages project on the first run; on later runs it fails with "already exists",
      # which is fine (a real token/account problem then fails the deploy step below).
      - name: create the Pages project if missing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create space-station-rs --production-branch=main
        continue-on-error: true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=space-station-rs --branch=main --commit-dirty=true
